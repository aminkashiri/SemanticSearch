NO_GPU: 0                 # Keep: Run on GPU
NUM_ENVIRONMENTS: 1       # Keep: Single robot instance for real-world
DUMP_LOCATION: datadump
EXP_NAME: real_world_eval
VISUALIZE: 1              # Set to 1 for essential real-world debugging and map visualization
PRINT_IMAGES: 1           # Keep: Saves visualization images
GROUND_TRUTH_SEMANTICS: 0 # Keep: Uses real-time perception
seed: 0
SHOW_RL_OBS: True

ENVIRONMENT:
  forward: 0.25           # Keep
  turn_angle: 30.0        # Keep
  frame_height: 720       # Adjusted to standard sensor +
  frame_width: 1280        # Adjusted to standard sensor resolution
  camera_height: 0.3556     # Keep
  hfov: 60.0              # Adjusted: Defaulting to a common, less extreme HFOV for real cameras.
  min_depth: 0.2          # Adjusted: Ignore unreliable very close-range depth data (e.g., 20cm)
  max_depth: 5.0          # Adjusted: Real-world depth reliability limit
  num_receptacles: 21
  category_map_file: projects/real_world_ovmm/configs/example_cat_map.json
  use_detic_viz: True     # Keep

AGENT:
  max_steps: 1000         # Adjusted: Lowered to prevent endless failure loops in deployment
  panorama_start: 1       # Keep
  exploration_strategy: seen_frontier
  radius: 0.18           # Keep
  fall_wait_steps: 0
  clip_embeddings_file: data/objects/clip_embeddings.pickle

  SEMANTIC_MAP:
    semantic_categories: rearrange
    num_sem_categories: 5
    map_size_cm: 4800
    map_resolution: 2        # Increased from 1 cm/cell to 5 cm/cell for SLAM stability.
    vision_range: 100
    global_downscaling: 2
    du_scale: 4
    cat_pred_threshold: 1.0
    exp_pred_threshold: 1.0
    map_pred_threshold: 20.0    # Lowered from 100.0 to 5.0 for real-world sparsity.
    been_close_to_radius: 100
    explored_radius: 150
    must_explore_close: False
    min_obs_height_cm: 150
    exploration_type: 'raycast'
    gaze_width: 10
    gaze_distance: 200
    dilate_obstacles: True
    dilate_size: 3
    dilate_iter: 1

  SKILLS:
    GAZE_OBJ:
      type: rl
      checkpoint_path: data/checkpoints/ovmm_baseline_home_robot_challenge_2023/gaze_at_obj.pth
      rl_config: projects/habitat_ovmm/configs/agent/gaze_rl.yaml # This path is now ignored due to skip_skills: True
      gym_obs_keys:
        - robot_head_depth
        - object_embedding
        - object_segmentation
        - joint
        - is_holding
        - relative_resting_position
      allowed_actions:
        - arm_action
        - base_velocity
      arm_joint_mask: [0, 0, 0, 0, 0, 0, 1]
      max_displacement: 0.25
      max_turn_degrees: 30.0
      min_turn_degrees: 5.0
      min_displacement: 0.1
      sensor_height: 160
      sensor_width: 120
      nav_goal_seg_channels: 1
      terminate_condition: grip
      grip_threshold: 0.8
      max_joint_delta: 0.1
      min_joint_delta: 0.02

    PICK:
      type: hw

    NAV_TO_OBJ:
      type: heuristic
      checkpoint_path: data/checkpoints/ovmm_baseline_home_robot_challenge_2023/nav_to_obj.pth
      rl_config: projects/habitat_ovmm/configs/agent/nav_to_obj_rl.yaml
      gym_obs_keys:
        - robot_head_depth
        - object_embedding
        - ovmm_nav_goal_segmentation
        - receptacle_segmentation
        - start_receptacle
        - robot_start_gps
        - robot_start_compass
        - joint
      allowed_actions:
        - stop
        - move_forward
        - turn_left
        - turn_right
      arm_joint_mask: [0, 0, 0, 0, 0, 0, 0]
      max_displacement: 0.25
      max_turn_degrees: 30.0
      min_turn_degrees: 5.0
      min_displacement: 0.1
      sensor_height: 160
      sensor_width: 120
      terminate_condition: discrete_stop
      nav_goal_seg_channels: 2

    NAV_TO_REC:
      type: heuristic
      checkpoint_path: data/checkpoints/ovmm_baseline_home_robot_challenge_2023/nav_to_rec.pth
      rl_config: projects/habitat_ovmm/configs/agent/nav_to_obj_rl.yaml
      gym_obs_keys:
        - robot_head_depth
        - ovmm_nav_goal_segmentation
        - receptacle_segmentation
        - goal_receptacle
        - robot_start_gps
        - robot_start_compass
        - joint
      allowed_actions:
        - stop
        - move_forward
        - turn_left
        - turn_right
      arm_joint_mask: [0, 0, 0, 0, 0, 0, 0]
      max_displacement: 0.25
      max_turn_degrees: 30.0
      min_turn_degrees: 5.0
      min_displacement: 0.1
      sensor_height: 160
      sensor_width: 120
      terminate_condition: discrete_stop
      nav_goal_seg_channels: 1


    PLACE:
      type: heuristic
      checkpoint_path: data/checkpoints/ovmm_baseline_home_robot_challenge_2023/place.pth
      rl_config: projects/habitat_ovmm/configs/agent/place_rl.yaml
      gym_obs_keys:
        - robot_head_depth
        - goal_receptacle
        - joint
        - goal_recep_segmentation
        - is_holding
        - object_embedding
      allowed_actions:
        - arm_action
        - base_velocity
        - manipulation_mode
      arm_joint_mask: [1, 1, 1, 1, 1, 0, 0]
      max_displacement: 0.25
      max_turn_degrees: 30.0
      min_turn_degrees: 5.0
      min_displacement: 0.1
      sensor_height: 160
      sensor_width: 120
      nav_goal_seg_channels: 1
      terminate_condition: ungrip
      grip_threshold: -0.8
      manip_mode_threshold: 0.8
      constraint_base_in_manip_mode: True
      max_joint_delta: 0.1
      min_joint_delta: 0.02

  skip_skills:
    nav_to_obj: False
    nav_to_rec: False
    gaze_at_obj: True       # CRITICAL FIX: Set to True to skip PPOAgent/RL config loading
    gaze_at_rec: True
    pick: False
    place: False

  PLANNER:
    collision_threshold: 0.20
    # FMM Stability Fixes: Reduced to prevent obstacle swelling from eating the goal point
    obs_dilation_selem_radius: 6   
    goal_dilation_selem_radius: 6  
    step_size: 5
    use_dilation_for_stg: False
    min_obs_dilation_selem_radius: 1
    min_goal_distance_cm: 100
    map_downsample_factor: 1
    map_update_frequency: 1
    discrete_actions: True
    verbose: True
    explored_area_dilation_radius: 10
    explored_area_erosion_radius: 10

EVAL_VECTORIZED:
  simulator_gpu_ids: [0]
  specific_episodes: 0
  goal_on_same_floor: 0
  split: val
  num_episodes_per_env: 1
  record_videos: 0
  record_planner_videos: 0
  metrics_save_freq: 1