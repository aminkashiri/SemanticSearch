# =============================================================================
# Scout GOAT - Office Navigation Config (No Stairs)
# Hardware constraints: forward=0.25m, turn=30°, HFOV=80°
# =============================================================================

NO_GPU: 0
NUM_ENVIRONMENTS: 1
DUMP_LOCATION: datadump
EXP_NAME: scout_office_nav1
VISUALIZE: 1
PRINT_IMAGES: 1
GROUND_TRUTH_SEMANTICS: 0
VISUALIZATION_LEVEL: 3
seed: 0
VERBOSE: False

EVAL_SETTINGS:
  control_frequency: 0.5
  wait_for_action: True
  reset_nav: False
  episode_timeout_minutes: 15
  task_timeout_steps: 500
  save_trajectory: True
  save_semantic_maps: True
  log_verbose: False

ENVIRONMENT:
  forward: 0.25                # FIXED - Scout hardware
  turn_angle: 30.0             # FIXED - Scout hardware  
  frame_height: 720
  frame_width: 1280
  camera_height: 0.55
  hfov: 80.0                   # FIXED - Realsense D435
  min_depth: 0.20
  max_depth: 5.0               # REDUCED: Office depths rarely exceed 5m
  category_map_file: projects/real_world_ovmm/configs/example_cat_map.json
  use_detic_viz: True
  max_num_sub_task_episodes: 1
  evaluate_instance_tracking: False

AGENT:
  max_steps: 500
  panorama_start: 1
  exploration_strategy: frontier
  frontier_metric: distance
  exploration_type: raycast
  radius: 0.30
  fall_wait_steps: 0

  COMMUNICATION:
    radius: 500

  SEMANTIC_MAP:
    semantic_categories: dataset
    num_sem_categories: 129
    map_size_cm: 4800
    map_resolution: 5            # 5cm/cell
    vision_range: 100            # 100 cells = 5m vision range
    global_downscaling: 2
    du_scale: 4
    
    # === TUNED FOR OFFICE ===
    cat_pred_threshold: 4.0      # REDUCED from 5.0: Detect objects with fewer points
    exp_pred_threshold: 1.0      # Keep default
    map_pred_threshold: 2.0      # INCREASED from 1.0: Need more points to mark obstacle
                                 # Helps reduce spurious obstacles from noise
    
    explored_radius: 12          # 12 cells = 60cm around robot marked explored
    been_close_to_radius: 150    # 150cm = 1.5m 
    target_blacklisting_radius: 60  # REDUCED from 100: Smaller blacklist zone
    
    min_obs_height_cm: 20        # INCREASED from 10: Ignore floor cables, carpet edges
    
    goal_filtering: True
    record_instance_ids: True
    exploration_type: raycast
    
    # === MUST MATCH REALSENSE ===
    gaze_width: 75               # Slightly less than HFOV (80°) for reliability
    gaze_distance: 4.5           # REDUCED from 5.0: Conservative for office clutter
    
    dilate_obstacles: True
    dilate_size: 1
    dilate_iter: 1
    
    # === NEW: Disable stair detection for office ===
    enable_stair_detection: False

  SUPERGLUE:
    max_keypoints: 1024
    keypoint_threshold: 0.005
    nms_radius: 4
    superglue_model: indoor
    sinkhorn_iterations: 20
    match_threshold: 0.2
    score_function: confidence_sum
    score_thresh_image: 24.5
    score_thresh_lang: 0.24
    match_projection_threshold: 0.2
    goto_past_pose: True

  DETIC:
    config_file: Detic/configs/Detic_LCOCOI21k_CLIP_SwinB_896b32_4x_ft4x_max-size.yaml
    vocabulary: custom
    custom_vocabulary: chair,desk,table,monitor,keyboard,mouse,laptop,phone,cup,mug,bottle,book,backpack,bag,pen,notebook,printer,whiteboard,cabinet,shelf,plant,trash_can,door,window,couch,lamp
    confidence_threshold: 0.25
    weights: Detic/models/Detic_LCOCOI21k_CLIP_SwinB_896b32_4x_ft4x_max-size.pth
    augment_mask_with_box: True

  PLANNER:
    collision_threshold: 0.12    # INCREASED slightly: 0.25m step, if moved < 12cm = collision
                                 # More forgiving than 0.10 for odometry noise
    
    # Dilation math: robot radius = 30cm, map resolution = 5cm
    # 30cm / 5cm = 6 cells is robot footprint radius
    # But obstacles already have some extent, so 2-3 cells dilation is reasonable
    obs_dilation_selem_radius: 3   # 2 cells = 10cm additional safety margin
    goal_dilation_selem_radius: 2
    min_obs_dilation_selem_radius: 2  # Can reduce to 5cm if stuck
    
    # step_size is for FMM planner gradient descent, not robot movement
    step_size: 5                 # REDUCED from 20: Finer path following in cells
    
    use_dilation_for_stg: False
    min_goal_distance_cm: 70     # REDUCED from 50: Stop closer to objects
    
    map_downsample_factor: 1
    map_update_frequency: 1
    discrete_actions: True
    verbose: True
    
    # goal_tolerance is in cells for FMM planner
    goal_tolerance: 8            # 4 cells = 20cm (reasonable for 25cm step size)
    continuous_angle_tolerance: 25.0
    
    explored_area_dilation_radius: 2
    explored_area_erosion_radius: 2
    goal_filtering: True
    frontier_metric: distance

  skip_skills:
    nav_to_obj: False
    nav_to_rec: True
    gaze_at_obj: True
    gaze_at_rec: True
    pick: True
    place: True

habitat:
  simulator:
    agents:
      agent0:
        sim_sensors:
          depth_sensor:
            height: 720
            width: 1280
            position: [0, 0.55, 0]
            hfov: 80.0
            max_depth: 5.0
        turn_angle: 30.0

EVAL_VECTORIZED:
  simulator_gpu_ids: [0]
  specific_episodes: 0
  goal_on_same_floor: 0
  split: val
  num_episodes_per_env: 1
  record_videos: 0
  record_planner_videos: 0
  metrics_save_freq: 1